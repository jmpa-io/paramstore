---
retry: &retry
  retry:
    manual:
      permit_on_passed: true

plugins:
  login: &login
    docker-login#v2.1.0:
      username: delivery-platform-${ENVIRONMENT:-prod}
      password-env: TOKEN

  go: &go
    docker#v5.9.0:
      image: docker.cloudsmith.io/myob/devex/go:latest
      volumes: [".:/go/src/app"]
      workdir: "/go/src/app"
      always-pull: true
      propagate-environment: true

  sonarqube: &sonarqube
    myob-ops/sonarqube#v4.0.0:
      project_key: sonar-ops-and-arch:paramstore
      project_name: paramstore
      sources: [.]

steps:
  - label: ':jenkins: Lint'
    branches: ["!default", "!v*.*.*"]
    command: docker pull docker.cloudsmith.io/myob/devex/go:latest
    <<: *retry
    agents:
      queue: default-dev
    plugins:
      <<: *login
      <<: *go

  - label: ':sweating: Test'
    branches: ["!default", "!v*.*.*"]
    command: echo make test
    <<: *retry
    plugins:
      <<: *go

  - label: ':sonarqube: Sonarqube'
    branches: ["!default", "!v*.*.*"]
    <<: *retry
    soft_fail:
      - exit_status: '*'
    plugins:
      <<: *sonarqube

  - wait: ~
    branches: ["!default", "!v*.*.*"]

  - label: ':teacher: Integration Test'
    branches: ["!default", "!v*.*.*"]
    command: echo make example
    <<: *retry
    plugins:
      <<: *go

  - wait: ~
    branches: "v*.*.*"

  - label: ':github: Release'
    commands: make release
    branches: "v*.*.*"
