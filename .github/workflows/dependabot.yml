name: Dependabot auto-merge.
on:
  pull_request:
    types: [opened, synchronize]
    author:
      - 'dependabot[bot]'

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  dependabot-automerge:
    uses: myob-ops/dependabot-automerge/.github/workflows/dependabot-automerge.yml@main
