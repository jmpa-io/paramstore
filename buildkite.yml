---
retry: &retry
  retry:
    manual:
      permit_on_passed: true

plugins:
  go: &go
    docker#v5.7.0:
      image: docker.myob.com/devex/go:latest
      volumes: [".:/go/src/app"]
      workdir: "/go/src/app"
      always-pull: true
      propagate-environment: true

  sonarqube: &sonarqube
    myob-ops/sonarqube#v4.0.0:
      project_key: sonar-ops-and-arch:paramstore
      project_name: paramstore
      sources: [.]

env:
  MAIN: build.branch == pipeline.default_branch
  NOT_MAIN: build.branch != pipeline.default_branch

steps:
  - label: ':jenkins: Lint'
    command: echo make lint
    <<: *retry
    # plugins:
    #   <<: *go

  - label: ':sweating: Test'
    command: echo make test
    <<: *retry
    # plugins:
    #   <<: *go

  - label: ':sonarqube: Sonarqube'
    <<: *retry
    soft_fail:
      - exit_status: '*'
    plugins:
      <<: *sonarqube

  - wait

  - label: ':teacher: Integration Test'
    command: echo make example
    <<: *retry
    # plugins:
    #   <<: *go

  - wait: ~
    branches: "v*.*.0"

  - label: ':github: Release'
    commands: make release
    branches: "v*.*.0"
