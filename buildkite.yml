---
retry: &retry
  retry:
    manual:
      permit_on_passed: true

plugins:
  sonarqube: &sonarqube
    myob-ops/sonarqube#v4.0.0:
      project_key: sonar-ops-and-arch:paramstore
      project_name: paramstore
      sources: [.]

env:
  MAIN: build.branch == pipeline.default_branch
  NOT_MAIN: build.branch != pipeline.default_branch

steps:
  - label: ':jenkins: Lint'
    command: make lint
    <<: *retry

  - label: ':composer: Test'
    command: make test
    <<: *retry

  - label: ':sonarqube: Sonarqube'
    <<: *retry
    soft_fail:
      - exit_status: '*'
    plugins:
      <<: *sonarqube

  - wait

  - label: ':teacher: Integration Test'
    command: make exmaple
    <<: *retry

  - wait

  # TODO add matrix
  - label: ':sloth: hi'
    command: go build
    artifact_paths:
      - "*.go"

  - wait

  - label: ':github: Release'
    commands:
      - buildkite-agent artifacts download *.go
      - ./bin/release.sh $BUILDKITE_BRANCH
    branches: "release/v*.*.0"
